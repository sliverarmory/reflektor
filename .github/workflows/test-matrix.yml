name: Test Matrix

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  REFLEKTOR_BOF_CORPUS_DIR: ${{ github.workspace }}/test/corpus/Situational-Awareness-BOFs

jobs:
  darwin:
    name: darwin-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goarch: amd64
            rust_target: x86_64-apple-darwin
          - runner: macos-15
            goarch: arm64
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out Situational Awareness BOF corpus
        uses: actions/checkout@v4
        with:
          repository: sliverarmory/Situational-Awareness-BOFs
          ref: 693174ff525595c5ec61b08fdccb5f057ad52c94
          path: test/corpus/Situational-Awareness-BOFs
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.rust_target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Build Darwin BOF corpus target
        working-directory: test/corpus/Situational-Awareness-BOFs
        run: ./scripts/build-target.sh darwin "${GOARCH}"
      - name: Run Darwin C, Go, and Rust fixture tests
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test ./bof ./internal/bofloader -count=1
          intentional_skip_pattern='TestBuild(CSharedLibraryMatrix|RecursiveCSharedLibraryMatrix|BOFMatrix)|TestLoadAndExecuteGeneratedBOF|TestLoadAndExecuteLegacyDarwinELFBOF|TestBOFLoadWithOptions|TestSituationalAwarenessBOFCorpus(Child)?'
          go test ./... -skip "${intentional_skip_pattern}" -count=1 -v | tee darwin-test.log
          memmod_test="TestLoadLibraryAndCallExport_DarwinArm64"
          if [[ "${GOARCH}" == "amd64" ]]; then
            memmod_test="TestLoadLibraryAndCallExport_DarwinAMD64"
          fi
          for test_name in \
            TestLoadGeneratedCDylibAndCallStartW \
            TestLoadGeneratedGoDylibAndCallStartW \
            TestLoadGeneratedRustHTTPSharedLibrary \
            TestLoadGeneratedCSharedLibraryRecursiveMode \
            TestLoadGeneratedGoSharedLibraryRecursiveMode \
            TestLoadGeneratedRustSharedLibraryRecursiveMode \
            TestLoadLibraryRecursiveDependencies \
            TestCallExportWithArgs \
            TestBOFPackageDependencyGraphIsIsolated \
            TestNativePackageCallExport \
            TestNativePackageRejectsGoCSharedImage \
            TestNativePackageRejectsGoCSharedInLaterFatSlice \
            TestDarwinLoaderTransactionsUnderSchedulerPressure \
            "${memmod_test}"; do
            if ! grep -Fq -- "--- PASS: ${test_name} " darwin-test.log; then
              echo "Required Darwin test did not pass: ${test_name}"
              exit 1
            fi
          done
          unexpected_skips="$(grep -E '^--- SKIP:' darwin-test.log | grep -Ev "${intentional_skip_pattern}" || true)"
          if [[ -n "${unexpected_skips}" ]]; then
            echo "Darwin tests were skipped; refusing to pass CI."
            echo "${unexpected_skips}"
            exit 1
          fi
          if grep -Fq 'skipping on GitHub Actions runner' darwin-test.log; then
            echo "Found a CI skip guard in Darwin loader tests; refusing to pass CI."
            exit 1
          fi
          CGO_ENABLED=0 go test ./integration -run '^TestCallExportWith(Args|PuregoCallback)$' -count=1 -v | tee darwin-nocgo-test.log
          for test_name in TestCallExportWithArgs TestCallExportWithPuregoCallback; do
            if ! grep -Fq -- "--- PASS: ${test_name} " darwin-nocgo-test.log; then
              echo "Required CGO-free Darwin test did not pass: ${test_name}"
              exit 1
            fi
          done
          CGO_ENABLED=0 go test ./memmod -run '^TestDarwinLoaderTransactionsUnderSchedulerPressure$' -count=1 -v | tee darwin-memmod-nocgo-test.log
          if ! grep -Fq -- '--- PASS: TestDarwinLoaderTransactionsUnderSchedulerPressure ' darwin-memmod-nocgo-test.log; then
            echo "Required CGO-free Darwin loader thread-affinity test did not pass"
            exit 1
          fi
          if grep -Fq -- '--- SKIP:' darwin-memmod-nocgo-test.log; then
            echo "CGO-free Darwin loader thread-affinity test was skipped; refusing to pass CI."
            exit 1
          fi
          CGO_ENABLED=0 go test ./integration -run '^(TestLoadAndExecuteGeneratedBOF|TestLoadAndExecuteLegacyDarwinELFBOF|TestBOFLoadWithOptions)$' -count=1 -v | tee darwin-bof-nocgo-test.log
          for test_name in TestLoadAndExecuteGeneratedBOF TestLoadAndExecuteLegacyDarwinELFBOF TestBOFLoadWithOptions; do
            if ! grep -Fq -- "--- PASS: ${test_name} " darwin-bof-nocgo-test.log; then
              echo "Required CGO-free Darwin BOF execution test did not pass: ${test_name}"
              exit 1
            fi
          done
          if grep -Fq -- '--- SKIP:' darwin-bof-nocgo-test.log; then
            echo "CGO-free Darwin BOF execution test was skipped; refusing to pass CI."
            exit 1
          fi
          CGO_ENABLED=0 go test ./integration -run '^TestSituationalAwarenessBOFCorpus$' -count=1 -v | tee darwin-bof-corpus-test.log
          if ! grep -Fq -- '--- PASS: TestSituationalAwarenessBOFCorpus ' darwin-bof-corpus-test.log; then
            echo "Required Darwin BOF corpus execution test did not pass"
            exit 1
          fi
          if grep -Fq -- '--- SKIP:' darwin-bof-corpus-test.log; then
            echo "Darwin BOF corpus execution test was skipped; refusing to pass CI."
            exit 1
          fi

  linux-native:
    name: linux-${{ matrix.goarch }}-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
            rust_target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            goarch: arm64
            rust_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "1"
      CC: zig cc
      CXX: zig c++
    steps:
      - uses: actions/checkout@v4
      - name: Check out Situational Awareness BOF corpus
        uses: actions/checkout@v4
        with:
          repository: sliverarmory/Situational-Awareness-BOFs
          ref: 693174ff525595c5ec61b08fdccb5f057ad52c94
          path: test/corpus/Situational-Awareness-BOFs
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.rust_target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Build Linux BOF corpus target
        working-directory: test/corpus/Situational-Awareness-BOFs
        run: ./scripts/build-target.sh linux "${GOARCH}"
      - name: Install libcurl development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - name: Run Linux C, Go, and Rust fixture tests
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test ./bof ./internal/bofloader -count=1
          intentional_skip_pattern='TestBuild(CSharedLibraryMatrix|RecursiveCSharedLibraryMatrix|BOFMatrix)|TestLoadAndExecuteGeneratedBOF|TestLoadAndExecuteLegacyDarwinELFBOF|TestBOFLoadWithOptions|TestSituationalAwarenessBOFCorpus(Child)?'
          go test ./... -skip "${intentional_skip_pattern}" -count=1 -v | tee linux-test.log
          for test_name in \
            TestLoadGeneratedCLinuxSOAndCallStartW \
            TestLoadGeneratedGoLinuxSOAndCallStartW \
            TestLoadGeneratedRustHTTPSharedLibrary \
            TestLoadGeneratedCSharedLibraryRecursiveMode \
            TestLoadGeneratedGoSharedLibraryRecursiveMode \
            TestLoadGeneratedRustSharedLibraryRecursiveMode \
            TestLoadLibraryRecursiveDependencies \
            TestCallExportWithArgs \
            TestBOFPackageDependencyGraphIsIsolated \
            TestNativePackageCallExport \
            TestNativePackageRejectsGoCSharedImage \
            TestNativePackageLinuxDependencyGraphIsIsolated \
            TestNativePackageCallExportWithArgsLinux \
            TestNativePackageRustCallExportWithArgsLinux \
            TestNativePackageELFLifecycleLinux \
            TestNativePackageCSharedConsumerLinux \
            TestLoadLibraryAndCallExport_Linux; do
            if ! grep -Fq -- "--- PASS: ${test_name} " linux-test.log; then
              echo "Required Linux test did not pass: ${test_name}"
              exit 1
            fi
          done
          unexpected_skips="$(grep -E '^--- SKIP:' linux-test.log | grep -Ev "${intentional_skip_pattern}" || true)"
          if [[ -n "${unexpected_skips}" ]]; then
            echo "Linux tests were skipped; refusing to pass CI."
            echo "${unexpected_skips}"
            exit 1
          fi
          CGO_ENABLED=0 go test ./integration -run '^(TestCallExportWith(Args|PuregoCallback)|TestNativePackage(CallExport|CallExportWithArgsLinux|RustCallExportWithArgsLinux|ELFLifecycleLinux|LinuxDependencyGraphIsIsolated))$' -count=1 -v | tee linux-nocgo-test.log
          for test_name in \
            TestCallExportWithArgs \
            TestCallExportWithPuregoCallback \
            TestNativePackageCallExport \
            TestNativePackageLinuxDependencyGraphIsIsolated \
            TestNativePackageCallExportWithArgsLinux \
            TestNativePackageRustCallExportWithArgsLinux \
            TestNativePackageELFLifecycleLinux; do
            if ! grep -Fq -- "--- PASS: ${test_name} " linux-nocgo-test.log; then
              echo "Required CGO-free Linux test did not pass: ${test_name}"
              exit 1
            fi
          done
          CGO_ENABLED=0 go test ./integration -run '^(TestLoadAndExecuteGeneratedBOF|TestBOFLoadWithOptions)$' -count=1 -v | tee linux-bof-nocgo-test.log
          for test_name in TestLoadAndExecuteGeneratedBOF TestBOFLoadWithOptions; do
            if ! grep -Fq -- "--- PASS: ${test_name} " linux-bof-nocgo-test.log; then
              echo "Required CGO-free Linux BOF execution test did not pass: ${test_name}"
              exit 1
            fi
          done
          if grep -Fq -- '--- SKIP:' linux-bof-nocgo-test.log; then
            echo "CGO-free Linux BOF execution test was skipped; refusing to pass CI."
            exit 1
          fi
          CGO_ENABLED=0 go test ./integration -run '^TestSituationalAwarenessBOFCorpus$' -count=1 -v | tee linux-bof-corpus-test.log
          if ! grep -Fq -- '--- PASS: TestSituationalAwarenessBOFCorpus ' linux-bof-corpus-test.log; then
            echo "Required Linux BOF corpus execution test did not pass"
            exit 1
          fi
          if grep -Fq -- '--- SKIP:' linux-bof-corpus-test.log; then
            echo "Linux BOF corpus execution test was skipped; refusing to pass CI."
            exit 1
          fi
          CGO_ENABLED=1 go test -race ./integration -run '^TestNativePackageCallExportWithArgsLinux$' -count=1 -v | tee linux-native-race-test.log
          if ! grep -Fq -- '--- PASS: TestNativePackageCallExportWithArgsLinux ' linux-native-race-test.log; then
            echo "Required race-enabled native-package Linux test did not pass"
            exit 1
          fi

  linux-386:
    name: linux-386-docker
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Check out Situational Awareness BOF corpus
        uses: actions/checkout@v4
        with:
          repository: sliverarmory/Situational-Awareness-BOFs
          ref: 693174ff525595c5ec61b08fdccb5f057ad52c94
          path: test/corpus/Situational-Awareness-BOFs
          fetch-depth: 1
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Build linux/386 BOF corpus target
        working-directory: test/corpus/Situational-Awareness-BOFs
        run: ./scripts/build-target.sh linux 386
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Run linux/386 C, Go, and Rust fixture tests in Docker
        run: |
          docker build --platform linux/386 -f testdata/docker/linux-memmod.Dockerfile -t reflektor-linux-386-ci .
          docker run --rm --platform linux/386 reflektor-linux-386-ci

  linux-arm-bof:
    name: linux-arm-full-qemu
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Check out Situational Awareness BOF corpus
        uses: actions/checkout@v4
        with:
          repository: sliverarmory/Situational-Awareness-BOFs
          ref: 693174ff525595c5ec61b08fdccb5f057ad52c94
          path: test/corpus/Situational-Awareness-BOFs
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Build and inspect linux/arm BOF fixtures
        run: |
          set -euo pipefail
          mkdir -p test/bof-fixtures
          REFLEKTOR_BOF_FIXTURE_DIR="${GITHUB_WORKSPACE}/test/bof-fixtures" \
            CGO_ENABLED=0 go test ./integration \
              -run '^TestBuildBOFMatrix$/^linux-arm$' -count=1 -v | tee linux-arm-fixture-build-test.log
          if ! grep -Fq -- '--- PASS: TestBuildBOFMatrix ' linux-arm-fixture-build-test.log; then
            echo "The linux/arm BOF fixture build and inspection did not pass."
            exit 1
          fi
          test -s test/bof-fixtures/fixture_linux_arm.o
          test -s test/bof-fixtures/options_fixture_linux_arm.o
      - name: Prepare pinned linux/arm BOF corpus
        working-directory: test/corpus/Situational-Awareness-BOFs
        run: |
          set -euo pipefail
          git apply "${GITHUB_WORKSPACE}/testdata/corpus/situational-awareness-linux-arm.patch"
          manifest_tmp="$(mktemp)"
          jq '
            .artifacts += [
              .artifacts[]
              | select(.os == "linux" and .arch == "arm64")
              | .os = "linux"
              | .arch = "arm"
              | .path |= sub("^dist/linux/arm64/"; "dist/linux/arm/")
            ]
          ' testdata/e2e-manifest.json > "${manifest_tmp}"
          mv "${manifest_tmp}" testdata/e2e-manifest.json
          ./scripts/build-target.sh linux arm
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - uses: docker/setup-buildx-action@v3
      - name: Run full linux/arm BOF and shared-library tests under QEMU
        run: |
          set -euo pipefail
          docker build --platform linux/arm/v7 -f testdata/docker/linux-bof.Dockerfile -t reflektor-linux-arm-bof-ci .
          docker run --rm --platform linux/arm/v7 reflektor-linux-arm-bof-ci

