  windows:
    name: windows-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            goarch: amd64
            rust_target: x86_64-pc-windows-msvc
          - runner: windows-2022
            goarch: 386
            rust_target: i686-pc-windows-msvc
          - runner: windows-11-arm
            goarch: arm64
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out Situational Awareness BOF corpus
        uses: actions/checkout@v4
        with:
          repository: sliverarmory/Situational-Awareness-BOFs
          ref: 693174ff525595c5ec61b08fdccb5f057ad52c94
          path: test/corpus/Situational-Awareness-BOFs
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.rust_target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Build Windows BOF corpus target
        working-directory: test/corpus/Situational-Awareness-BOFs
        run: ./scripts/build-target.sh windows "${GOARCH}"
      - name: Run Windows C, Go, and Rust fixture tests
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test ./bof ./internal/bofloader -count=1
          intentional_skip_pattern='TestBuild(CSharedLibraryMatrix|RecursiveCSharedLibraryMatrix|BOFMatrix)|TestLoadAndExecuteGeneratedBOF|TestLoadAndExecuteLegacyDarwinELFBOF|TestBOFLoadWithOptions|TestSituationalAwarenessBOFCorpus(Child)?'
          go test ./... -skip "${intentional_skip_pattern}" -count=1 -v | tee windows-test.log
          for test_name in \
            TestLoadGeneratedCWindowsDLLAndCallStartW \
            TestLoadGeneratedGoWindowsDLLAndCallStartW \
            TestLoadGeneratedRustHTTPSharedLibrary \
            TestLoadGeneratedCSharedLibraryRecursiveMode \
            TestLoadGeneratedGoSharedLibraryRecursiveMode \
            TestLoadGeneratedRustSharedLibraryRecursiveMode \
            TestLoadLibraryRecursiveDependencies \
            TestCallExportWithArgs \
            TestBOFPackageDependencyGraphIsIsolated \
            TestNativePackageCallExport \
            TestNativePackageRejectsGoCSharedImage \
            TestCallExportWithGoCallbackWindows; do
            if ! grep -Fq -- "--- PASS: ${test_name} " windows-test.log; then
              echo "Required Windows test did not pass: ${test_name}"
              exit 1
            fi
          done
          unexpected_skips="$(grep -E '^--- SKIP:' windows-test.log | grep -Ev "${intentional_skip_pattern}" || true)"
          if [[ -n "${unexpected_skips}" ]]; then
            echo "Windows tests were skipped; refusing to pass CI."
            echo "${unexpected_skips}"
            exit 1
          fi
          CGO_ENABLED=0 go test ./integration -run '^(TestLoadAndExecuteGeneratedBOF|TestBOFLoadWithOptions)$' -count=1 -v | tee windows-bof-nocgo-test.log
          for test_name in TestLoadAndExecuteGeneratedBOF TestBOFLoadWithOptions; do
            if ! grep -Fq -- "--- PASS: ${test_name} " windows-bof-nocgo-test.log; then
              echo "Required CGO-free Windows BOF execution test did not pass: ${test_name}"
              exit 1
            fi
          done
          if grep -Fq -- '--- SKIP:' windows-bof-nocgo-test.log; then
            echo "CGO-free Windows BOF execution test was skipped; refusing to pass CI."
            exit 1
          fi
          CGO_ENABLED=0 go test ./integration -run '^TestSituationalAwarenessBOFCorpus$' -timeout 45m -count=1 -v | tee windows-bof-corpus-test.log
          if ! grep -Fq -- '--- PASS: TestSituationalAwarenessBOFCorpus ' windows-bof-corpus-test.log; then
            echo "Required Windows BOF corpus execution test did not pass"
            exit 1
          fi
          if grep -Fq -- '--- SKIP:' windows-bof-corpus-test.log; then
            echo "Windows BOF corpus execution test was skipped; refusing to pass CI."
            exit 1
          fi

  fixture-build-matrix:
    name: fixture-build-matrix
    # Apple's nm understands the Mach-O rows while the Xcode objdump also
    # handles the ELF and PE artifacts produced by Zig.
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Validate the complete C fixture build matrix
        run: |
          set -euo pipefail
          go test ./integration -run '^TestBuild(CSharedLibraryMatrix|RecursiveCSharedLibraryMatrix)$' -count=1 -v | tee fixture-build-test.log
          if ! grep -Fq -- '--- PASS: TestBuildCSharedLibraryMatrix ' fixture-build-test.log; then
            echo "The complete C fixture build matrix did not pass."
            exit 1
          fi
          if ! grep -Fq -- '--- PASS: TestBuildRecursiveCSharedLibraryMatrix ' fixture-build-test.log; then
            echo "The complete recursive C fixture build matrix did not pass."
            exit 1
          fi
          CGO_ENABLED=0 go test ./integration -run '^TestBuildBOFMatrix$' -count=1 -v | tee bof-fixture-build-test.log
          if ! grep -Fq -- '--- PASS: TestBuildBOFMatrix ' bof-fixture-build-test.log; then
            echo "The complete BOF fixture build matrix did not pass."
            exit 1
          fi

  native-tag-free-build-matrix:
    name: native-tag-free-build-matrix
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build native package without cgo or build tags
        run: |
          set -euo pipefail
          while read -r goos goarch; do
            echo "Building ./native for ${goos}/${goarch} with CGO_ENABLED=0"
            if [[ "${goos}/${goarch}" == "linux/arm" ]]; then
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" GOARM=7 go build -trimpath ./native
            else
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath ./native
            fi
          done <<'TARGETS'
          darwin amd64
          darwin arm64
          linux 386
          linux amd64
          linux arm
          linux arm64
          linux ppc64le
          linux riscv64
          windows 386
          windows amd64
          windows arm64
          TARGETS

  bof-build-matrix:
    name: bof-no-cgo-build-matrix
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate the platform capability manifest
        run: go test ./integration -run '^TestPlatformSupportManifest$' -count=1
      - name: Build BOF packages without cgo or tags
        run: |
          set -euo pipefail
          while read -r goos goarch; do
            echo "Building BOF packages for ${goos}/${goarch} with CGO_ENABLED=0"
            if [[ "${goos}/${goarch}" == "linux/arm" ]]; then
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" GOARM=7 go build -trimpath ./bof ./internal/bofloader
            else
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath ./bof ./internal/bofloader
            fi
          done <<'TARGETS'
          darwin amd64
          darwin arm64
          linux 386
          linux amd64
          linux arm
          linux arm64
          linux ppc64le
          linux riscv64
          windows 386
          windows amd64
          windows arm64
          TARGETS
      - name: Build all packages on full shared-library targets
        run: |
          set -euo pipefail
          while read -r goos goarch; do
            echo "Building all packages for full-support target ${goos}/${goarch} with CGO_ENABLED=0"
            if [[ "${goos}/${goarch}" == "linux/arm" ]]; then
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" GOARM=7 go build -trimpath ./...
            else
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath ./...
            fi
          done <<'TARGETS'
          darwin amd64
          darwin arm64
          linux 386
          linux amd64
          linux arm
          linux arm64
          linux ppc64le
          linux riscv64
          windows 386
          windows amd64
          windows arm64
          TARGETS
